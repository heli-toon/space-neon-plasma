<?xml version="1.0" encoding="UTF-8"?>
<!--
  SpaceNeonPlasmaMinimal Aurorae Button Set
  
  Required IDs per Aurorae spec:
    close[-hover|-pressed|-deactivated]
    minimize[-hover|-pressed|-deactivated]
    maximize[-hover|-pressed|-deactivated]
    restore[-hover|-pressed|-deactivated]
    alldesktops[-hover|-pressed|-deactivated]  (pin / on-all-desktops)
    keepabove[-hover|-pressed|-deactivated]
    keepbelow[-hover|-pressed|-deactivated]
    shade[-hover|-pressed|-deactivated]
    help[-hover|-pressed|-deactivated]
    
  All buttons share a 24x24 squircle pill shape.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="216" height="216" viewBox="0 0 216 216">
  <defs>
    <!-- Button base: squircle pill -->
    <radialGradient id="btn-base" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#2a2a3e"/>
      <stop offset="100%" stop-color="#18182a"/>
    </radialGradient>
    <radialGradient id="btn-hover-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#3a3a58"/>
      <stop offset="100%" stop-color="#22223a"/>
    </radialGradient>
    <radialGradient id="btn-close-hover-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#ff4a4a"/>
      <stop offset="100%" stop-color="#cc2020"/>
    </radialGradient>
    <radialGradient id="btn-min-hover-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#ff9d00"/>
      <stop offset="100%" stop-color="#cc6a00"/>
    </radialGradient>
    <radialGradient id="btn-max-hover-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#00c87a"/>
      <stop offset="100%" stop-color="#007a49"/>
    </radialGradient>
  </defs>

  <!-- ╔══════════════════════════════════╗
       ║  CLOSE BUTTON (col 0, row 0)     ║
       ╚══════════════════════════════════╝ -->
  <!-- close – normal -->
  <g id="close">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <line x1="7" y1="7" x2="17" y2="17" stroke="#c0c0d8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="7" x2="7" y2="17" stroke="#c0c0d8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- close – hover -->
  <g id="close-hover" transform="translate(24,0)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-close-hover-bg)" stroke="#ff6060" stroke-width="0.5"/>
    <line x1="7" y1="7" x2="17" y2="17" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="17" y1="7" x2="7" y2="17" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- close – pressed -->
  <g id="close-pressed" transform="translate(48,0)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#aa1010" stroke="#ff2020" stroke-width="0.5"/>
    <line x1="7" y1="7" x2="17" y2="17" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="17" y1="7" x2="7" y2="17" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- close – deactivated -->
  <g id="close-deactivated" transform="translate(72,0)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <line x1="7" y1="7" x2="17" y2="17" stroke="#555570" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="7" x2="7" y2="17" stroke="#555570" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  MINIMIZE BUTTON (row 1)         ║
       ╚══════════════════════════════════╝ -->
  <!-- minimize – normal -->
  <g id="minimize" transform="translate(0,24)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <line x1="6" y1="13" x2="18" y2="13" stroke="#c0c0d8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- minimize – hover -->
  <g id="minimize-hover" transform="translate(24,24)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-min-hover-bg)" stroke="#ffaa00" stroke-width="0.5"/>
    <line x1="6" y1="13" x2="18" y2="13" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- minimize – pressed -->
  <g id="minimize-pressed" transform="translate(48,24)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#996600" stroke="#cc8800" stroke-width="0.5"/>
    <line x1="6" y1="13" x2="18" y2="13" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- minimize – deactivated -->
  <g id="minimize-deactivated" transform="translate(72,24)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <line x1="6" y1="13" x2="18" y2="13" stroke="#555570" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  MAXIMIZE BUTTON (row 2)         ║
       ╚══════════════════════════════════╝ -->
  <!-- maximize – normal -->
  <g id="maximize" transform="translate(0,48)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <rect x="6" y="7" width="12" height="10" rx="1.5" fill="none" stroke="#c0c0d8" stroke-width="1.4"/>
  </g>

  <!-- maximize – hover -->
  <g id="maximize-hover" transform="translate(24,48)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-max-hover-bg)" stroke="#00e088" stroke-width="0.5"/>
    <rect x="6" y="7" width="12" height="10" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- maximize – pressed -->
  <g id="maximize-pressed" transform="translate(48,48)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#006640" stroke="#009960" stroke-width="0.5"/>
    <rect x="6" y="7" width="12" height="10" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- maximize – deactivated -->
  <g id="maximize-deactivated" transform="translate(72,48)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <rect x="6" y="7" width="12" height="10" rx="1.5" fill="none" stroke="#555570" stroke-width="1.4"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  RESTORE BUTTON (row 3)          ║
       ╚══════════════════════════════════╝ -->
  <g id="restore" transform="translate(0,72)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <!-- Two overlapping squares (restore icon) -->
    <rect x="5" y="8" width="9" height="9" rx="1" fill="none" stroke="#c0c0d8" stroke-width="1.3"/>
    <rect x="10" y="5" width="9" height="9" rx="1" fill="#1a1a28" stroke="#c0c0d8" stroke-width="1.3"/>
  </g>

  <g id="restore-hover" transform="translate(24,72)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-max-hover-bg)" stroke="#00e088" stroke-width="0.5"/>
    <rect x="5" y="8" width="9" height="9" rx="1" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    <rect x="10" y="5" width="9" height="9" rx="1" fill="#006640" stroke="#ffffff" stroke-width="1.3"/>
  </g>

  <g id="restore-pressed" transform="translate(48,72)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#006640" stroke="#009960" stroke-width="0.5"/>
    <rect x="5" y="8" width="9" height="9" rx="1" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    <rect x="10" y="5" width="9" height="9" rx="1" fill="#004a2e" stroke="#ffffff" stroke-width="1.3"/>
  </g>

  <g id="restore-deactivated" transform="translate(72,72)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <rect x="5" y="8" width="9" height="9" rx="1" fill="none" stroke="#555570" stroke-width="1.3"/>
    <rect x="10" y="5" width="9" height="9" rx="1" fill="#1a1a28" stroke="#555570" stroke-width="1.3"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  ALLDESKTOPS (pin) BUTTON (row4) ║
       ╚══════════════════════════════════╝ -->
  <g id="alldesktops" transform="translate(0,96)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <!-- Pin icon -->
    <circle cx="12" cy="10" r="3" fill="none" stroke="#c0c0d8" stroke-width="1.3"/>
    <line x1="12" y1="13" x2="12" y2="18" stroke="#c0c0d8" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <g id="alldesktops-hover" transform="translate(24,96)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-hover-bg)" stroke="#6060a0" stroke-width="0.5"/>
    <circle cx="12" cy="10" r="3" fill="none" stroke="#ffffff" stroke-width="1.3"/>
    <line x1="12" y1="13" x2="12" y2="18" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <g id="alldesktops-pressed" transform="translate(48,96)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#2a2a4a" stroke="#5050a0" stroke-width="0.5"/>
    <!-- Pin active — filled circle -->
    <circle cx="12" cy="10" r="3" fill="#c0c0d8" stroke="#c0c0d8" stroke-width="1.3"/>
    <line x1="12" y1="13" x2="12" y2="18" stroke="#c0c0d8" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <g id="alldesktops-deactivated" transform="translate(72,96)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <circle cx="12" cy="10" r="3" fill="none" stroke="#555570" stroke-width="1.3"/>
    <line x1="12" y1="13" x2="12" y2="18" stroke="#555570" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  KEEPABOVE BUTTON (row 5)        ║
       ╚══════════════════════════════════╝ -->
  <g id="keepabove" transform="translate(0,120)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <polyline points="6,14 12,8 18,14" fill="none" stroke="#c0c0d8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="keepabove-hover" transform="translate(24,120)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-hover-bg)" stroke="#6060a0" stroke-width="0.5"/>
    <polyline points="6,14 12,8 18,14" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="keepabove-pressed" transform="translate(48,120)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#2a2a4a" stroke="#5050a0" stroke-width="0.5"/>
    <polyline points="6,14 12,8 18,14" fill="none" stroke="#ff6b00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="keepabove-deactivated" transform="translate(72,120)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <polyline points="6,14 12,8 18,14" fill="none" stroke="#555570" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  KEEPBELOW BUTTON (row 6)        ║
       ╚══════════════════════════════════╝ -->
  <g id="keepbelow" transform="translate(0,144)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <polyline points="6,9 12,15 18,9" fill="none" stroke="#c0c0d8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="keepbelow-hover" transform="translate(24,144)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-hover-bg)" stroke="#6060a0" stroke-width="0.5"/>
    <polyline points="6,9 12,15 18,9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="keepbelow-pressed" transform="translate(48,144)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#2a2a4a" stroke="#5050a0" stroke-width="0.5"/>
    <polyline points="6,9 12,15 18,9" fill="none" stroke="#ff6b00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="keepbelow-deactivated" transform="translate(72,144)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <polyline points="6,9 12,15 18,9" fill="none" stroke="#555570" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  SHADE BUTTON (row 7)            ║
       ╚══════════════════════════════════╝ -->
  <g id="shade" transform="translate(0,168)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <line x1="6" y1="8" x2="18" y2="8" stroke="#c0c0d8" stroke-width="1.4" stroke-linecap="round"/>
    <polyline points="9,12 12,16 15,12" fill="none" stroke="#c0c0d8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="shade-hover" transform="translate(24,168)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-hover-bg)" stroke="#6060a0" stroke-width="0.5"/>
    <line x1="6" y1="8" x2="18" y2="8" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <polyline points="9,12 12,16 15,12" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="shade-pressed" transform="translate(48,168)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#2a2a4a" stroke="#5050a0" stroke-width="0.5"/>
    <line x1="6" y1="8" x2="18" y2="8" stroke="#ff6b00" stroke-width="1.4" stroke-linecap="round"/>
    <polyline points="9,12 12,8 15,12" fill="none" stroke="#ff6b00" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="shade-deactivated" transform="translate(72,168)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <line x1="6" y1="8" x2="18" y2="8" stroke="#555570" stroke-width="1.4" stroke-linecap="round"/>
    <polyline points="9,12 12,16 15,12" fill="none" stroke="#555570" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ╔══════════════════════════════════╗
       ║  HELP BUTTON (row 8)             ║
       ╚══════════════════════════════════╝ -->
  <g id="help" transform="translate(0,192)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-base)" stroke="#3a3a5a" stroke-width="0.5"/>
    <text x="12" y="16" font-family="sans-serif" font-size="13" font-weight="bold"
          text-anchor="middle" fill="#c0c0d8">?</text>
  </g>

  <g id="help-hover" transform="translate(24,192)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="url(#btn-hover-bg)" stroke="#6060a0" stroke-width="0.5"/>
    <text x="12" y="16" font-family="sans-serif" font-size="13" font-weight="bold"
          text-anchor="middle" fill="#ffffff">?</text>
  </g>

  <g id="help-pressed" transform="translate(48,192)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#2a2a4a" stroke="#5050a0" stroke-width="0.5"/>
    <text x="12" y="16" font-family="sans-serif" font-size="13" font-weight="bold"
          text-anchor="middle" fill="#ff6b00">?</text>
  </g>

  <g id="help-deactivated" transform="translate(72,192)">
    <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#1a1a28" stroke="#2a2a3e" stroke-width="0.5"/>
    <text x="12" y="16" font-family="sans-serif" font-size="13" font-weight="bold"
          text-anchor="middle" fill="#555570">?</text>
  </g>

</svg>
