<?xml version="1.0" encoding="UTF-8"?>
<!--
  SpaceNeonPlasmaMinimal Aurorae Window Decoration
  Squircle-style rounded corners (radius 12px)
  Deep space dark theme with neon orange accent
  
  Aurorae SVG element IDs (required by KWin):
    decoration         - inactive window frame
    decoration-active  - active window frame
    decoration-hover   - hovered window frame (optional)
    
  Button SVG IDs (in separate files or via buttonPath):
    close, minimize, maximize, restore, alldesktops, keepabove, keepbelow, shade, help
    Each: normal, hover, pressed, deactivated state suffixes
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Squircle clip path: rounded rect with 12px radius -->
    <clipPath id="squircle-clip">
      <rect x="0" y="0" width="200" height="200" rx="12" ry="12"/>
    </clipPath>

    <!-- Gradient for active title bar -->
    <linearGradient id="title-active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1a28" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d0d18" stop-opacity="1"/>
    </linearGradient>

    <!-- Gradient for inactive title bar -->
    <linearGradient id="title-inactive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#111119" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </linearGradient>

    <!-- Active neon orange border glow -->
    <filter id="glow-active" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════════
       INACTIVE WINDOW DECORATION (id="decoration")
       KWin scales this to actual window size
       ════════════════════════════════════════════════════════ -->
  <g id="decoration">
    <!-- Window background — squircle rounded frame -->
    <rect x="0.5" y="0.5" width="199" height="199" rx="12" ry="12"
          fill="#0d0d18" stroke="#2a2a3e" stroke-width="1" opacity="0.95"/>
    <!-- Subtle top accent line (inactive = dim) -->
    <rect x="12" y="0.5" width="176" height="1" rx="0.5"
          fill="#3a3a5e" opacity="0.6"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       ACTIVE WINDOW DECORATION (id="decoration-active")
       ════════════════════════════════════════════════════════ -->
  <g id="decoration-active">
    <!-- Window background — squircle rounded frame -->
    <rect x="0.5" y="0.5" width="199" height="199" rx="12" ry="12"
          fill="#10101e" stroke="#ff6b00" stroke-width="1" opacity="0.98"/>
    <!-- Neon orange top accent line — the "squircle" signature -->
    <rect x="12" y="0.5" width="176" height="1.5" rx="0.75"
          fill="#ff6b00" opacity="0.9"/>
    <!-- Soft inner glow on border -->
    <rect x="1" y="1" width="198" height="198" rx="11.5" ry="11.5"
          fill="none" stroke="#ff6b00" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       HOVER STATE (id="decoration-hover") — optional
       ════════════════════════════════════════════════════════ -->
  <g id="decoration-hover">
    <rect x="0.5" y="0.5" width="199" height="199" rx="12" ry="12"
          fill="#13131f" stroke="#ff6b00" stroke-width="1" opacity="0.97"/>
    <rect x="12" y="0.5" width="176" height="1.5" rx="0.75"
          fill="#ff8c2a" opacity="0.8"/>
  </g>

</svg>
