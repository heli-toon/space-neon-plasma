[General]
background=/usr/share/sddm/themes/SpaceNeon/background.jpg

[Theme]
# Anonymous user name
# If not set, for a local login the real name of the current user is used.
# For remote logins only the host name of the machine is used.
# If set, this is used as user name instead.
# User=

# Background color, if the image cannot be loaded
# Alternatively, you can set a custom pixmap property, to fill
# the background with a pattern.
# Color=#333338

# Font for the UI elements
# Font=Sans Serif,10,-1,5,50,0,0,0,0,0

# Color for the UI elements
#Foreground=#ffffff

# Display name of the theme, displayed in the KCM (Control Module)
#Name=Space Neutron SDDM

# Author of the theme (optional)
#Author=

# Description of the theme (optional)
#Description=Space Neon theme for SDDM login screen

# Preview image, displayed in the KCM (Control Module)
#Preview=

# URL to the theme's website or source repository (optional)
#URL=

# License under which the theme is released (optional)
#License=

# Unsupported options are ignored
